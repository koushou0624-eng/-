<title>カイタイ事務</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* =====================================================================
   カイタイ事務 — 見た目（作り直し版）
   方針：外でもスマホで読める／押す所がひと目でわかる／色は意味のある所だけ
   ===================================================================== */

/* ---------- 色・文字・角丸（ここを変えれば全体が変わる） ---------- */
:root {
  --bg: #f2f0eb;          /* 紙のような背景 */
  --panel: #ffffff;       /* カード */
  --soft: #ebe8e1;        /* 薄い面（選択中でない部分など） */
  --line: #ddd8ce;        /* 区切り線 */
  --ink: #1a1c20;         /* 文字 */
  --muted: #5e636b;       /* 補足の文字 */
  --brand: #1d3b63;       /* 作業着ネイビー：基本のボタン・選択中 */
  --brand-ink: #ffffff;
  --brand-soft: #e3eaf4;
  --link: #1d5aa6;
  --go: #f6b400;          /* 安全イエロー：いちばん大事な「記録する」 */
  --go-ink: #1a1c20;
  --ok: #1f7a46;  --ok-soft: #e2f1e8;
  --warn: #9a5a00; --warn-soft: #fff1cc; --warn-line: #e9a800;
  --bad: #c0322a; --bad-soft: #fde9e7;
  --line-green: #06c755;
  --radius: 14px; --radius-s: 10px;
  --shadow: 0 1px 2px rgba(20, 24, 30, .06), 0 2px 8px rgba(20, 24, 30, .04);
  --font: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --panel: #1b1e22; --soft: #262a30; --line: #30353c;
    --ink: #eceef0; --muted: #a3a9b1;
    --brand: #4b7fc4; --brand-ink: #fff; --brand-soft: #1f2c3d; --link: #8db8ef;
    --ok: #5cc48a; --ok-soft: #173325; --warn: #f0b84a; --warn-soft: #3a2e12; --warn-line: #c98f12;
    --bad: #ff7b70; --bad-soft: #3d1c1a;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --panel: #1b1e22; --soft: #262a30; --line: #30353c;
  --ink: #eceef0; --muted: #a3a9b1;
  --brand: #4b7fc4; --brand-ink: #fff; --brand-soft: #1f2c3d; --link: #8db8ef;
  --ok: #5cc48a; --ok-soft: #173325; --warn: #f0b84a; --warn-soft: #3a2e12; --warn-line: #c98f12;
  --bad: #ff7b70; --bad-soft: #3d1c1a;
  --shadow: none; color-scheme: dark;
}

/* ---------- 土台 ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.6;
  font-feature-settings: "palt" 0; -webkit-font-smoothing: antialiased;
}
main { padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 720px; margin: 0 auto; }
h1, h2, h3 { line-height: 1.35; letter-spacing: .01em; }
h2 { font-size: 19px; margin: 26px 0 10px; }
h2:first-child { margin-top: 4px; }
b, strong { font-weight: 700; }
.tab { display: none; } .tab.active { display: block; }
.num, .r-num, .big, .v { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--go); outline-offset: 2px; }

/* ---------- 上の帯 ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top, 0px));
  background: var(--bg); color: var(--ink);
}
.brand { font-weight: 700; font-size: 15px; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
.brand::before { content: ""; width: 10px; height: 18px; border-radius: 3px; background: var(--go); box-shadow: 4px 0 0 var(--brand); margin-right: 6px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: 0; color: var(--muted); border: 1px solid var(--line); padding: 1px 7px; border-radius: 999px; }
.sync { font-size: 12px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
.sync.err { color: var(--bad); } .sync.busy { color: var(--warn); }
.case-switch, .tabs { display: none !important; } /* 旧メニュー（中の仕組みでだけ使う） */

/* ---------- 下のメニュー ---------- */
.mainnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex;
  background: var(--panel); border-top: 1px solid var(--line);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
}
.mainnav button {
  flex: 1; border: 0; background: none; cursor: pointer; font: inherit; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 62px; padding: 8px 2px 6px; font-size: 12px; position: relative;
}
.mainnav button span:last-child { white-space: nowrap; }
.mainnav .ic { width: 26px; height: 26px; display: grid; place-items: center; }
.mainnav .ic svg { width: 24px; height: 24px; }
.mainnav button.active { color: var(--brand); font-weight: 700; }
.mainnav button.active::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brand); }
:root[data-theme="dark"] .mainnav button.active, :root[data-theme="dark"] .back { color: var(--link); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mainnav button.active, :root:not([data-theme="light"]) .back { color: var(--link); } }
body { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }

/* ---------- 文字 ---------- */
.hint { color: var(--muted); margin: 0 0 12px; font-size: 14px; line-height: 1.7; }
.warn, .warnline { color: var(--warn); font-size: 14px; }
.sub, .mut { color: var(--muted); font-weight: 400; }
.sub { font-size: 13px; }
.empty { color: var(--muted); }
.neg, td.over { color: var(--bad); }
.best, .tipline, td.minus { color: var(--ok); }
.monthline { color: var(--link); }
.legal { font-size: 12px; font-weight: 400; color: var(--muted); }
.flex1 { flex: 1; }

/* ---------- 入力 ---------- */
label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0; }
label.check { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 15px; margin: 8px 0; }
input, select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; margin-top: 5px;
  border: 1.5px solid var(--line); border-radius: var(--radius-s);
  font: inherit; font-size: 16px; color: var(--ink); background: var(--panel);
  transition: border-color .12s, box-shadow .12s;
}
textarea { min-height: 96px; line-height: 1.6; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
input::placeholder, textarea::placeholder { color: #a39e94; }
input[type=checkbox], input[type=radio] { width: 22px; height: 22px; min-height: 0; margin: 0; accent-color: var(--brand); flex: none; }
input[type=file] { min-height: 0; }
select { appearance: none; -webkit-appearance: none; padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 52%, calc(100% - 12px) 52%; background-size: 6px 6px; background-repeat: no-repeat; }
label.inline { display: flex; align-items: center; gap: 10px; color: var(--ink); max-width: 100%; }
label.inline select { width: auto; min-width: 0; margin: 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
fieldset { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 16px 14px; margin: 0; box-shadow: var(--shadow); }
fieldset.wide { grid-column: 1 / -1; }
legend { font-weight: 700; font-size: 16px; padding: 0 6px; color: var(--ink); }
#tab-input form.grid { display: grid; grid-template-columns: 1fr; }
#tab-input fieldset { padding-top: 14px; }
#tab-input legend { float: left; width: 100%; padding: 0 0 2px; font-size: 17px; }
#tab-input legend + * { clear: both; }

/* ---------- ボタン ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 10px 18px; border: 0; border-radius: var(--radius-s);
  background: var(--brand); color: var(--brand-ink);
  font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none;
  transition: transform .06s, filter .12s;
}
.btn:active { transform: scale(.98); filter: brightness(.95); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: var(--panel); color: var(--ink); border: 1.5px solid var(--line); font-weight: 700; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn.big, .btn.wide { width: 100%; min-height: 56px; padding: 14px; font-size: 17px; border-radius: var(--radius); }

.link { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; font-size: 15px; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .warn { flex-basis: 100%; }
.pdf-msg { margin: 0; font-size: 13px; }
.danger-zone { margin-top: 24px; padding-top: 16px; border-top: 1px dashed var(--line); }
.danger-zone .btn { color: var(--bad); border-color: var(--bad-soft); width: 100%; }

/* ---------- 共通の部品 ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.card-title { margin: 0 0 10px; font-size: 17px; }
.fold > summary { cursor: pointer; font-weight: 700; font-size: 16px; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::after { content: ""; flex: none; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: -4px 4px 0 0; transition: transform .15s; }
.fold[open] > summary::after { transform: rotate(-135deg); margin-top: 4px; }
.fold[open] > summary { margin-bottom: 12px; }
.chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.chip.soon { background: var(--warn-soft); color: var(--warn); }
.chip.late { background: var(--bad-soft); color: var(--bad); }
.chip.line { background: var(--line-green); color: #fff; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); margin-left: 6px; }
.badge.late { background: var(--bad-soft); color: var(--bad); }
.badge.soon { background: var(--warn-soft); color: var(--warn); }
.tag2, .billtag { display: inline-block; font-size: 11px; font-weight: 400; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.billtag { margin-left: 6px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(90px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px);
  background: #1a1c20; color: #fff; padding: 12px 18px; border-radius: 12px;
  font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
.callout { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--brand); border-radius: var(--radius-s); padding: 12px 14px; margin-bottom: 14px; line-height: 1.7; }
.callout.bad { border-color: var(--bad-soft); border-left-color: var(--bad); background: var(--bad-soft); }
.alertbox { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--ok); border-radius: var(--radius-s); padding: 12px 14px; margin: 14px 0; }
.alertbox.mid { border-left-color: var(--warn-line); } .alertbox.bad { border-left-color: var(--bad); }
.alertbox ul { margin: 6px 0 0; padding-left: 20px; line-height: 1.8; font-size: 14px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 14px; color: var(--muted); font-size: 14px; }
.facts b { color: var(--ink); }

/* ---------- ホーム ---------- */
.h-date { font-size: 28px; font-weight: 700; margin: 6px 0 2px; letter-spacing: .02em; }
.h-sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; }
.alert-pill {
  width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  border: 1.5px solid var(--warn-line); background: var(--warn-soft); color: var(--warn);
  border-radius: var(--radius); padding: 14px 16px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 8px; text-align: left;
}
.alert-list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin: 0 0 16px; padding: 12px 16px 12px 32px; line-height: 1.75; font-size: 15px; }
.ok-line { display: flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 700; margin: 0 0 16px; background: var(--ok-soft); padding: 12px 16px; border-radius: var(--radius); }
.sec-label { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin: 22px 0 8px 4px; }

/* 一覧（現場・記録・選択） */
.rows, .plist { list-style: none; margin: 0 0 14px; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.rows > li, .plist li { border-bottom: 1px solid var(--line); }
.rows > li:last-child, .plist li:last-child { border-bottom: 0; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 14px 16px; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.row:active { background: var(--soft); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #b9b3a8; flex: none; }
.dot.live { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
.dot.done { background: var(--soft); border: 2px solid var(--line); }
.r-main { flex: 1; min-width: 0; display: grid; gap: 4px; }
.r-title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.r-sub { font-size: 13px; color: var(--muted); }
.r-num { text-align: right; display: grid; gap: 2px; }
.r-num b { font-size: 18px; }
.chev { width: 9px; height: 9px; flex: none; border-right: 2px solid #b5afa4; border-top: 2px solid #b5afa4; transform: rotate(45deg); font-size: 0; margin-left: 2px; }
.empty-row { padding: 18px 16px; color: var(--muted); font-size: 15px; line-height: 1.7; }
.line-t { color: var(--line-green); font-weight: 700; }
.wchip { display: inline-block; padding: 3px 11px; border-radius: 7px; font-size: 13px; font-weight: 700; color: #fff; background: var(--wc); letter-spacing: .02em; }
.fixrow { padding: 0 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* 右下の「＋ 記録する」 */
.fab {
  position: fixed; z-index: 25; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  border: 0; background: var(--go); color: var(--go-ink); border-radius: 16px; padding: 16px 22px;
  font: inherit; font-size: 17px; font-weight: 700; cursor: pointer;
  box-shadow: 0 2px 0 rgba(0,0,0,.15), 0 8px 20px rgba(0,0,0,.18);
}
.fab:active { transform: translateY(1px); }

/* ---------- 現場の見出し ---------- */
.sitehead { margin-bottom: 8px; }
.back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--brand); font: inherit; font-size: 15px; font-weight: 700; padding: 6px 0; cursor: pointer; }
.site-name { font-size: 26px; margin: 4px 0 2px; }
.site-sub { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
.seg4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--soft); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
.seg4 button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 15px; font-weight: 700; min-height: 44px; border-radius: 9px; cursor: pointer; }
.seg4 button.on { background: var(--brand); color: var(--brand-ink); }
.chips-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 2px 0 12px; }
.chips-row button { border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 14px; min-height: 38px; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.chips-row button.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 700; }
:root[data-theme="dark"] .chips-row button.on { color: var(--link); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chips-row button.on { color: var(--link); } }

/* ---------- 処分 ---------- */
.total-card { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; background: var(--brand); color: var(--brand-ink); border-radius: var(--radius); padding: 18px; }
.total-card .lab { font-size: 13px; opacity: .8; }
.total-card .big { font-size: 32px; font-weight: 700; line-height: 1.2; }
.total-card .r { text-align: right; }
.link.more { display: block; margin: 10px 4px 16px auto; font-size: 14px; }
#qwOpen { margin: 0 0 6px; }
.disptop { margin-bottom: 4px; }
.dt-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.dt-head h2 { margin: 0; font-size: 18px; }
.seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; color: var(--muted); min-height: 36px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 700; border-radius: 8px; cursor: pointer; }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.dt-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.dt-kpis > div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 10px; display: grid; gap: 2px; min-width: 0; }
.dt-kpis span { font-size: 12px; color: var(--muted); }
.dt-kpis b { font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; overflow-wrap: anywhere; }
.dt-kpis small { font-size: 13px; font-weight: 400; margin: 0 2px; }
.dt-rows { list-style: none; margin: 0; padding: 14px 16px; display: grid; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.dt-line { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.dt-name { font-weight: 700; font-size: 15px; }
.dt-num { font-size: 15px; font-variant-numeric: tabular-nums; }
.dt-num b { font-size: 18px; }
.dt-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.bar { height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 6px; }
.bar.over i { background: var(--bad); }

/* マニフェストの詳しい入力 */
#tab-manifest h2 { margin: 22px 0 8px; font-size: 18px; }
.mgroup { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; background: var(--panel); }
.ghead { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; margin-bottom: 8px; }
.ghead .gname { grid-column: 1; } .ghead .btn { grid-column: 2; grid-row: 1; } .ghead .gsum { grid-column: 1 / -1; }
.gname { font-weight: 700; font-size: 17px; }
.gsum { color: var(--muted); font-size: 14px; }
.gsum b { color: var(--ink); }
.mcard { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 10px 12px; margin-bottom: 10px; }
.mcard.flash { outline: 3px solid var(--go); }
.mhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mhead .chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 100%; order: 4; min-width: 0; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 10px; }
.mgrid label { margin: 8px 0; }
.mcost { font-size: 13px; color: var(--muted); min-width: 0; }
.mcost b { color: var(--ink); }
.small-pad { margin: 2px 0; font-size: 14px; }
.rare { border: 1.5px dashed var(--line); border-radius: var(--radius-s); padding: 12px; margin-bottom: 10px; }
.rare label { margin: 0 0 6px; color: var(--ink); font-weight: 700; }
.rare-row { display: flex; gap: 8px; flex-wrap: wrap; }
.rare-row select { flex: 1; min-width: 0; margin-top: 0; }
.always { margin-top: 10px; }
.always-title { font-size: 14px; color: var(--muted); font-weight: 700; }

/* ---------- お金（利益・経費・リース） ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .k { color: var(--muted); font-size: 13px; }
.kpi .v { font-size: 26px; font-weight: 700; margin: 2px 0; line-height: 1.25; }
.kpi.good { border: 2px solid var(--ok); } .kpi.good .v { color: var(--ok); }
.kpi.mid { border: 2px solid var(--warn-line); }
.kpi.bad { border: 2px solid var(--bad); background: var(--bad-soft); } .kpi.bad .v { color: var(--bad); }
.kpis.compact .v { font-size: 20px; }
.kpis.compact .kpi:last-child { grid-column: 1 / -1; }
.sumlist { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
.sumlist > div { display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 15px; }
.sumlist > div:last-child { border-bottom: 0; }
.sumlist b { font-variant-numeric: tabular-nums; }
.sumlist .total { background: var(--soft); font-weight: 700; }
.sumlist .total b { font-size: 19px; }
.expform { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; align-items: end; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 16px 16px; margin-bottom: 14px; }
.expform .btn { grid-column: 1 / -1; min-height: 50px; }
#tab-expense h2, #tab-lease h2 { margin: 26px 0 10px; font-size: 19px; }
#tab-expense h2:first-child, #tab-lease h2:first-child { margin-top: 4px; }
.lcalc { background: var(--bg); border-radius: var(--radius-s); padding: 10px 12px; margin: 10px 0 4px; display: grid; gap: 6px; }
.lsum { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.lsum b { font-size: 19px; font-variant-numeric: tabular-nums; }
.lbar { height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.lbar div { height: 100%; background: var(--warn-line); }
.lbar div.m { background: var(--ok); }
.forecast { border: 1.5px dashed var(--line); border-radius: var(--radius-s); padding: 10px 12px; font-size: 14px; }
.thlabel { color: var(--ink); font-weight: 700; }

/* 表（パソコン） */
.table-wrap { overflow-x: auto; }
.table-wrap + .hint { margin-top: 12px; }
table.cost { width: 100%; border-collapse: collapse; background: var(--panel); font-size: 15px; border-radius: var(--radius); overflow: hidden; }
table.cost th, table.cost td { border-bottom: 1px solid var(--line); padding: 10px 12px; text-align: left; }
table.cost thead th { font-size: 13px; color: var(--muted); font-weight: 700; background: var(--soft); }
table.cost th.num, table.cost td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.cost tfoot th, table.cost tfoot td { background: var(--soft); font-weight: 700; border-bottom: 0; }
table.cost.wide { min-width: 560px; }
table.cost.wide td, table.cost.wide th { white-space: nowrap; }
table.cost.mini { font-size: 14px; }
table.cost.mini th, table.cost.mini td { padding: 7px 10px; }
td.cheap { color: var(--ok); font-weight: 700; background: var(--ok-soft); }

/* 表（スマホ）：1行＝1枚のカード */
@media (max-width: 600px) {
  .table-wrap { overflow: visible; }
  table.cost, table.cost.wide { min-width: 0; border: 1px solid var(--line); }
  table.cost thead { display: none; }
  table.cost, table.cost tbody, table.cost tfoot, table.cost tr { display: block; width: auto; }
  table.cost tr { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  table.cost tr:last-child { border-bottom: 0; }
  table.cost td, table.cost th, table.cost.wide td, table.cost.wide th { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 3px 0; border: 0; text-align: right; white-space: normal; font-size: 15px; background: none; }
  table.cost td::before, table.cost th::before { content: attr(data-label); color: var(--muted); font-size: 13px; text-align: left; font-weight: 400; flex: none; max-width: 55%; }
  table.cost tr > :first-child { display: block; text-align: left; font-weight: 700; font-size: 16px; padding-bottom: 4px; }
  table.cost tr > :first-child::before, table.cost td[data-label=""]::before { content: none; }
  table.cost td:empty { display: none; }
  table.cost tfoot { background: var(--soft); }
  table.cost tr:has(> :nth-child(2):last-child) { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  table.cost tr:has(> :nth-child(2):last-child) > :last-child::before { content: none; }
  table.cost tr:has(> :nth-child(2):last-child) > :first-child { padding-bottom: 0; font-size: 15px; }
}

/* ---------- 期限・チェック ---------- */
.deadline { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: var(--radius-s); padding: 12px 14px; margin-bottom: 10px; }
.deadline.need { border-left-color: var(--warn-line); }
.deadline.ok { border-left-color: var(--ok); }
.deadline .when { font-weight: 700; }
.deadline .sub { margin-top: 4px; }

/* ---------- 設定 ---------- */
.set-title { margin: 6px 0 2px; font-size: 26px; }
.set-hint { margin: 0 0 14px; }
#tab-settings .grid { display: block; }
#tab-settings fieldset.fold-fs { display: block; margin: 0 0 10px; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; box-shadow: var(--shadow); }
#tab-settings fieldset.fold-fs > legend { float: left; width: 100%; margin: 0; padding: 18px 16px; min-height: 60px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
#tab-settings fieldset.fold-fs > legend::after { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-135deg); margin-top: 4px; transition: transform .15s; }
#tab-settings fieldset.fold-fs.closed > legend::after { transform: rotate(45deg); margin-top: -4px; }
#tab-settings fieldset.fold-fs > :not(legend) { margin-left: 16px; margin-right: 16px; }
#tab-settings fieldset.fold-fs > legend + * { clear: both; }
#tab-settings fieldset.fold-fs > :last-child { margin-bottom: 16px; }
#tab-settings fieldset.fold-fs.closed > :not(legend) { display: none !important; }
.cloudbox { margin: 12px 0; }
.disp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 12px; }
.preset, .company { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; align-items: end; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 6px; }
.preset .pname, .company .pname { grid-column: 1 / -1; }
.preset .btn, .company .btn { margin-bottom: 12px; }
.site { border: 1px solid var(--line); border-radius: var(--radius-s); padding: 8px 12px; margin-bottom: 10px; background: var(--bg); }
.site-head { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.site-head .pname { flex: 1 1 100%; margin: 6px 0; }
.site-head label:not(.pname) { margin: 6px 0; flex: 1; }
.site-head .btn { margin-bottom: 6px; }
.sc-title { font-size: 16px; margin: 16px 0 8px; }
.members { list-style: none; padding: 0; margin: 4px 0 12px; display: grid; gap: 8px; }
.members li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); }
#inviteUrlRow, #lineDriverArea { margin-top: 10px; }
#inviteUrlRow input, #lineDriverArea input { flex: 1; min-width: 0; margin-top: 0; }
.steps { margin: 6px 0 12px; padding-left: 22px; line-height: 1.9; font-size: 15px; }
.codebox { background: var(--bg); border-radius: var(--radius-s); padding: 12px; margin-top: 10px; display: grid; gap: 8px; }
.codebox .code { font-size: 34px; font-weight: 700; letter-spacing: 8px; font-variant-numeric: tabular-nums; }
.codebox textarea { font-size: 14px; }
.invite-note { background: var(--brand-soft); border-radius: var(--radius-s); padding: 10px 12px; font-size: 14px; }

/* ---------- 現場を選ぶシート ---------- */
.sheet-back { position: fixed; inset: 0; z-index: 70; background: rgba(10, 12, 16, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; background: var(--bg); border-radius: 22px 22px 0 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-height: 80vh; overflow: auto; }
.sheet::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet-title { font-size: 19px; font-weight: 700; margin: 4px 4px 12px; }

/* ---------- ログイン ---------- */
.login { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; overflow: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.login-card { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px; box-shadow: var(--shadow); }
.login-card h1 { margin: 0 0 6px; font-size: 24px; }
.login-card h1::before { content: ""; display: inline-block; vertical-align: -2px; width: 10px; height: 20px; border-radius: 3px; background: var(--go); box-shadow: 4px 0 0 var(--brand); margin-right: 14px; }
.login-card .btn { width: 100%; margin-top: 10px; min-height: 52px; font-size: 16px; }
.login-card form { margin: 0; }
.login-card hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.login-card .link { display: block; margin: 14px auto 0; font-size: 15px; }
.login-error { color: var(--bad); min-height: 1.4em; margin: 8px 0 0; font-size: 14px; }

/* ---------- 書類（紙・PDF）：正式な書類の見た目なので明朝のまま ---------- */
.paper { background: #fff; color: #000; max-width: 210mm; min-height: 270mm; margin: 0 auto; padding: 18mm 16mm;
  border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,.12); font-family: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", serif; color-scheme: light; }
.paper h1 { text-align: center; font-size: 24px; letter-spacing: .4em; margin: 0 0 18px; }
.paper .right { text-align: right; } .paper .small { font-size: 12px; }
.paper table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
.paper th, .paper td { border: 1px solid #333; padding: 5px 7px; vertical-align: top; }
.paper th { background: #f1f1f1; font-weight: normal; text-align: left; white-space: nowrap; }
.paper td.num { text-align: right; white-space: nowrap; }
.paper .total { font-size: 20px; border-bottom: 2px solid #000; display: inline-block; padding: 4px 12px; margin: 8px 0; }
.paper .two { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.paper .blank { color: #999; }
.paper p { line-height: 1.9; }
table.gantt { font-size: 11px; }
table.gantt th.d, table.gantt td.d { width: 22px; min-width: 22px; padding: 2px; text-align: center; }
table.gantt td.on { background: #1d3b63; }
table.gantt td.ph { white-space: nowrap; }

/* ---------- 画面の幅ごと ---------- */
@media (max-width: 600px) {
  main { padding: 8px 16px 16px; }
  .paper { padding: 14px; min-height: 0; }
  .paper h1 { font-size: 20px; letter-spacing: .2em; }
  .brand .tag { display: none; }
}
@media (min-width: 701px) {
  .mainnav { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); max-width: none; justify-content: center; }
  .mainnav button { flex: 0 1 180px; flex-direction: row; gap: 8px; min-height: 52px; font-size: 15px; }
  .mainnav button.active::before { top: auto; bottom: 0; border-radius: 3px 3px 0 0; }
  body { padding-bottom: 24px; }
  .fab { bottom: 28px; }
  .toast { bottom: 28px; }
  .preset { grid-template-columns: 2fr repeat(4, 1fr) auto; }
  .preset .pname { grid-column: auto; }
}

/* ---------- 印刷 ---------- */
@media print {
  body { background: #fff; padding: 0; }
  .no-print, .toolbar, .topbar, .tabs, .mainnav, .fab, .toast { display: none !important; }
  main { padding: 0; max-width: none; }
  .tab { display: none !important; }
  .tab.active { display: block !important; }
  .paper { box-shadow: none; margin: 0; max-width: none; min-height: 0; padding: 0; }
  table.gantt td.on { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { size: A4; margin: 15mm; }
}

/* 利益の大きな数字：スマホでははみ出さないように */
@media (max-width: 600px) {
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi { padding: 12px 14px; min-width: 0; }
  .kpi .v { font-size: clamp(19px, 5.6vw, 24px); overflow-wrap: anywhere; }
  .kpi.good, .kpi.mid, .kpi.bad { grid-column: 1 / -1; }
  .kpi.good .v, .kpi.mid .v, .kpi.bad .v { font-size: 30px; }
}

/* =====================================================================
   入力を「押すだけ」に／ホームのまとめ／ログイン
   ===================================================================== */
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }
body.sheet-open { overflow: hidden; }
.btn.go, #qwOpen { background: var(--go); color: var(--go-ink); box-shadow: 0 2px 0 rgba(0,0,0,.14); }
.btn.go:disabled { background: var(--soft); color: var(--muted); box-shadow: none; opacity: 1; }

/* ロゴ：アイコンと同じ形に */
.brand::before { width: 22px; height: 22px; border-radius: 6px; background: url(icons/icon-192.png) center / cover; box-shadow: none; margin-right: 2px; }

/* 下から出るシート */
.sheet-back { animation: fade .18s ease-out; }
.sheet { animation: rise .24s cubic-bezier(.2,.8,.2,1); }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(40px); opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet-back, .done-mark * { animation: none !important; } }
.sheet { max-height: 92vh; max-height: 92dvh; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 6px; }
.sheet-head .sheet-title { margin: 0 4px; font-size: 21px; }
.x { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--soft); cursor: pointer; position: relative; flex: none; }
.x::before, .x::after { content: ""; position: absolute; left: 12px; right: 12px; top: 19px; height: 2px; background: var(--ink); border-radius: 2px; transform: rotate(45deg); }
.x::after { transform: rotate(-45deg); }
.sheet-foot { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom, 0px)); margin: 12px -16px calc(-16px - env(safe-area-inset-bottom, 0px)); padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
.sheet .btn.big { margin-top: 4px; }

/* 項目と選択ボタン */
.field { margin: 14px 0 6px; }
.flabel { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--ink); margin: 0 0 8px; }
.flabel i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); font-size: 12px; display: grid; place-items: center; flex: none; }
.choice { display: flex; flex-wrap: wrap; gap: 8px; }
.choice.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 4px; }
.choice.scroll::-webkit-scrollbar { display: none; }
.choice.scroll .cbtn { flex: none; }
.choice.for-select { margin-top: 6px; }
.cbtn, .choice > button {
  display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 8px 16px;
  border: 1.5px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink);
  font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; position: relative; transition: background .12s, border-color .12s;
}
.cbtn.on, .choice > button.on { border-color: var(--brand); background: var(--brand); color: var(--brand-ink); }
.cbtn.more { border-style: dashed; color: var(--muted); font-weight: 400; }
.cbtn.more.on { background: var(--panel); color: var(--ink); border-style: solid; }
.cbtn .sw { width: 12px; height: 12px; border-radius: 4px; background: var(--wc); flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
.choice.types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choice.types .cbtn { justify-content: flex-start; text-align: left; line-height: 1.3; }
.choice.types .cbtn.more { justify-content: center; }
.cbtn.date { margin: 0; color: var(--ink); overflow: hidden; }
.cbtn.date input { position: absolute; inset: 0; opacity: 0; min-height: 0; margin: 0; cursor: pointer; }
.field > input { margin-top: 10px; }

/* 重さ：大きな数字で */
.qty-row { display: flex; gap: 10px; align-items: stretch; margin-bottom: 10px; }
.qty-in { flex: 1; min-width: 0; height: 68px; margin: 0; font-size: 36px; font-weight: 700; text-align: right; padding: 0 16px; font-variant-numeric: tabular-nums; border-width: 2px; }
.unit { display: grid; grid-template-rows: 1fr 1fr; background: var(--soft); border-radius: 12px; padding: 3px; gap: 3px; }
.unit button { border: 0; background: none; border-radius: 9px; min-width: 56px; font: inherit; font-weight: 700; font-size: 15px; color: var(--muted); cursor: pointer; }
.unit button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.rec-preview { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 0 2px 8px; }
.rec-preview b { color: var(--ink); font-size: 17px; margin-left: 4px; }

/* 記録できた */
.done-sheet { text-align: center; padding-top: 28px; }
.done-mark { width: 84px; height: 84px; margin: 4px auto 12px; }
.done-mark svg { width: 100%; height: 100%; fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.done-mark circle { stroke: var(--ok); fill: var(--ok-soft); stroke-dasharray: 160; stroke-dashoffset: 160; animation: draw .45s ease-out forwards; }
.done-mark path { stroke: var(--ok); stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .3s .35s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.done-title { font-size: 22px; font-weight: 700; }
.done-text { font-size: 16px; line-height: 1.8; margin: 8px 0 20px; }
.done-btns { display: grid; gap: 8px; }

/* 新しい現場 */
.suffix-wrap { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
.suffix-wrap input { margin: 0; flex: 1; }
.suffix { color: var(--ink); font-weight: 700; font-size: 16px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.two-col label { min-width: 0; }
#caseSheet label .sub { display: block; margin-top: 6px; }
#caseQuick .btn.big { margin-top: 14px; }

/* ホームのまとめ */
.hero { position: relative; overflow: hidden; background: var(--brand); color: var(--brand-ink); border-radius: 20px; padding: 18px 18px 16px; margin: 4px 0 14px; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.06); }
.hero-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; opacity: .85; }
.hero-hello { font-weight: 700; }
.hero-main { margin: 14px 0 14px; display: grid; gap: 2px; }
.hero-lab { font-size: 13px; opacity: .8; }
.hero-big { font-size: 38px; line-height: 1.15; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(255,255,255,.14); border-radius: 12px; overflow: hidden; }
.hero-grid > div { background: rgba(0,0,0,.14); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.hero-grid span { font-size: 11px; opacity: .8; white-space: nowrap; }
.hero-grid b { font-size: 20px; font-variant-numeric: tabular-nums; }
.hero-grid small { font-size: 12px; margin-left: 2px; font-weight: 400; }
.hero::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--go); }

/* ログイン */
.login-hero { text-align: center; margin: 0 0 18px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.login-logo img { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 6px 16px rgba(29,59,99,.25); }
.login-card .login-hero h1 { margin: 12px 0 4px; font-size: 26px; }
.login-card .login-hero h1::before { content: none; }
.tagline { margin: 0 0 14px; font-size: 16px; color: var(--muted); }
.points { list-style: none; margin: 0 auto; padding: 0; display: grid; gap: 8px; text-align: left; max-width: 300px; }
.points li { position: relative; padding-left: 28px; font-size: 14px; }
.points li::before { content: ""; position: absolute; left: 4px; top: 4px; width: 7px; height: 12px; border-right: 2.5px solid var(--ok); border-bottom: 2.5px solid var(--ok); transform: rotate(45deg); }
#homeOut { padding-bottom: 84px; }

/* ===== オープニング動画 ===== */
.intro { position: fixed; inset: 0; z-index: 200; background: #000; display: grid; place-items: center; overflow: hidden; transition: opacity .45s ease; }
.intro.out { opacity: 0; pointer-events: none; }
html.intro-on, html.intro-on body { overflow: hidden; }
.intro video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s ease; background: #000; }
.intro video.fit { object-fit: contain; }

<script>
// カイタイ事務：画面と毎朝の通知（LINE）で共通に使う計算
// ブラウザでは window.KJCore、Node/Deno では module.exports / globalThis.KJCore として使う
(function (root) {
  'use strict';
  const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
  const yen = (n) => Math.round(n).toLocaleString('ja-JP');
  const isoOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const addDays = (iso, n) => { if (!iso) return null; const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d; };
  const fmtDate = (d) => (d ? `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日` : '');
  const md = (d) => (d ? `${d.getMonth() + 1}/${d.getDate()}` : '');
  // 「今日」（0時0分）。日本時間で動かすため、Node/Deno 側では TZ=Asia/Tokyo で実行する
  const todayOf = (date) => { const d = date ? new Date(date) : new Date(); d.setHours(0, 0, 0, 0); return d; };

  // name: 現場での呼び方、legal: 法律上の産業廃棄物の種類（報告書の集計に使う）
  const WASTE_TYPES = [
    { id: 'wood', name: '木（シバ）', legal: '木くず', unit: 't' },
    { id: 'concrete', name: 'コンクリートガラ（無筋）', legal: 'がれき類', unit: 't' },
    { id: 'concreteR', name: 'コンクリートガラ（有筋）', legal: 'がれき類', unit: 't' },
    { id: 'mixed', name: 'ミンチ', legal: '混合廃棄物', unit: 't' },
    { id: 'plastic', name: '廃プラ', legal: '廃プラスチック類', unit: 't' },
    { id: 'glass', name: '瓦', legal: 'ガラスくず・コンクリートくず及び陶磁器くず', unit: 't' },
    { id: 'gypsum', name: '石膏ボード', legal: 'ガラスくず・コンクリートくず及び陶磁器くず（廃石膏ボード）', unit: 't' },
    { id: 'asphalt', name: 'アスファルトガラ', legal: 'がれき類', unit: 't' },
    { id: 'metal', name: '金属くず（売れない鉄くずなど）', legal: '金属くず', unit: 't' },
    { id: 'asb', name: 'アスベスト（レベル3の成形板など）', legal: '石綿含有産業廃棄物', unit: '㎥' },
    { id: 'asbsp', name: 'アスベスト（レベル1・2の吹付けなど）', legal: '廃石綿等（特別管理産業廃棄物）', unit: '㎥', sp: true },
  ];
  const WT = Object.fromEntries(WASTE_TYPES.map((w) => [w.id, w]));
  const BASE_COUNT = WASTE_TYPES.length;
  // 設定で足したゴミの種類（settings.customTypes）を、種類の一覧に入れる（何度呼んでも同じ結果）
  function setCustomTypes(list) {
    WASTE_TYPES.splice(BASE_COUNT).forEach((w) => { delete WT[w.id]; });
    (list || []).forEach((u) => {
      if (!u || !u.id || !u.name) return;
      const w = { id: u.id, name: String(u.name), legal: u.legal || 'その他（種類を確認）', unit: u.unit === '㎥' ? '㎥' : 't', custom: true, alias: u.alias || '' };
      WASTE_TYPES.push(w); WT[w.id] = w;
    });
  }

  // 電子マニフェストの登録期限：引渡しから3日以内（土日を除いた目安）
  function plus3BizDays(iso) {
    const d = new Date(iso + 'T00:00:00'); let n = 0;
    while (n < 3) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) n++; }
    return d;
  }

  // 返送・報告の期限と状態
  function manifestChecks(m, now) {
    if (!m.date) return [];
    const sp = WT[m.type]?.sp, out = [];
    const st = (label, doneIso, due) => {
      if (doneIso) return { label, state: 'done', text: `${label} 済` };
      const diff = Math.round((due - now) / 86400000);
      if (diff < 0) return { label, state: 'late', due, text: `${label} ${-diff}日超過`, report: addDays(isoOf(due), 30) };
      return { label, state: diff <= 14 ? 'soon' : 'wait', due, text: `${label} あと${diff}日` };
    };
    if (m.kind === 'electronic') {
      out.push(st('JWNET登録', m.reg, plus3BizDays(m.date)));
      out.push(st('運搬終了報告', m.b2, addDays(m.date, sp ? 60 : 90)));
      out.push(st('処分終了報告', m.d, addDays(m.date, sp ? 60 : 90)));
      out.push(st('最終処分報告', m.e, addDays(m.date, 180)));
    } else {
      out.push(st('B2票', m.b2, addDays(m.date, sp ? 60 : 90)));
      out.push(st('D票', m.d, addDays(m.date, sp ? 60 : 90)));
      out.push(st('E票', m.e, addDays(m.date, 180)));
    }
    return out;
  }


  const LEASE_MODES = {
    calendar: 'リース会社の締め日ごと（登録のない会社は末日締め）',
    anniv: '借りた日から1か月ごと',
    days30: '借りた日から30日ごと',
  };
  const lastOfMonth = (d) => new Date(d.getFullYear(), d.getMonth() + 1, 0);
  // 借りた日から nか月後（月末を超える日は月末にそろえる）
  function addMonthsClamp(d, n) {
    const y = d.getFullYear(), m = d.getMonth() + n;
    const last = new Date(y, m + 1, 0).getDate();
    return new Date(y, m, Math.min(d.getDate(), last));
  }
  // リース会社の締め日（登録がなければ末日）
  const companyOf = (settings, name) => ((settings && settings.leaseCompanies) || []).find((x) => x.name && x.name.trim() === String(name || '').trim());
  const closeOf = (settings, l) => { const co = companyOf(settings, l.company); return co && co.close !== '' && co.close != null ? co.close : '末'; };
  const closeLabel = (c) => (c === '末' || c === 'end' ? '末日' : `${c}日`);
  // その月の締め日（31日締め → 30日の月は30日、末日締め → 月末）
  const closeDate = (y, m, c) => { const last = new Date(y, m + 1, 0).getDate(); return new Date(y, m, c === '末' ? last : Math.min(num(c) || last, last)); };
  // 月極の区切り（1区切り＝1回の請求）の終わりの日
  function segEnd(segStart, l0, k, mode, close = '末') {
    if (mode === 'calendar') {
      const thisClose = closeDate(segStart.getFullYear(), segStart.getMonth(), close);
      return segStart <= thisClose ? thisClose : closeDate(segStart.getFullYear(), segStart.getMonth() + 1, close);
    }
    if (mode === 'anniv') { const e = addMonthsClamp(l0, k + 1); e.setDate(e.getDate() - 1); return e; }
    const e = new Date(l0); e.setDate(e.getDate() + (k + 1) * 30 - 1); return e;
  }
  const DAY = 86400000;
  const dayCount = (a, b) => Math.round((b - a) / DAY) + 1;
  const mLabel = (end, k, mode) => (mode === 'calendar' ? `${end.getMonth() + 1}月` : `${k + 1}か月目`);

  // 区切りごとに「使った日数が決めた日数を超えたら月極、超えなければ日割り」で計算
  function leaseCalc(l, settings, endOverride, now) {
    const daily = num(l.daily), monthly = num(l.monthly), th = Math.max(1, num(l.th) || 1);
    const mode = LEASE_MODES[settings && settings.leaseMode] ? settings.leaseMode : 'calendar';
    const close = closeOf(settings, l);
    const extra = num(l.transport) + num(l.other);
    if (!l.start) return { days: 0, cost: extra, rent: 0, parts: [], state: 'none' };
    const s0 = new Date(l.start + 'T00:00:00'), e0 = new Date((endOverride || l.end || isoOf(now)) + 'T00:00:00');
    const days = dayCount(s0, e0);
    if (days <= 0) return { days: 0, cost: extra, rent: 0, parts: [], state: 'bad' };
    const segs = [];
    let cur = new Date(s0), k = 0;
    while (cur <= e0 && k < 240) {
      const natEnd = segEnd(cur, s0, k, mode, close);
      const to = natEnd < e0 ? natEnd : e0;
      const d = dayCount(cur, to);
      const len = dayCount(cur, natEnd); // その区切りで借りられる最大の日数
      segs.push({ from: new Date(cur), to, natEnd, d, len, monthly: d > th, label: mLabel(natEnd, k, mode), amount: d > th ? monthly : d * daily, ym: isoOf(natEnd).slice(0, 7) });
      cur = new Date(natEnd); cur.setDate(cur.getDate() + 1); k++;
    }
    const rent = segs.reduce((a, g) => a + (g.monthly ? monthly : g.d * daily), 0);
    const parts = segs.map((g) => (g.monthly ? `${g.label} ${g.d}日（${th}日超え → 月極）¥${yen(monthly)}` : `${g.label} 日割り ${g.d}日 × ¥${yen(daily)}`));
    const last = segs[segs.length - 1];
    const nMonthly = segs.filter((g) => g.monthly).length;
    const res = { days, rent, cost: rent + extra, parts, segs, full: nMonthly, rem: last.d, th, ongoing: !l.end && !endOverride, state: 'ok', mode, close,
      summary: nMonthly === segs.length ? '月極' : nMonthly ? `月極${nMonthly}・日割り${segs.length - nMonthly}` : '日割り' };
    if (!last.monthly) {
      if (last.len > th) {
        // この区切りの中で月極に切り替わる
        res.toSwitch = th - last.d + 1;
        res.lastDaily = new Date(last.from); res.lastDaily.setDate(res.lastDaily.getDate() + th - 1); // 日割りで済む最後の日
        if (res.ongoing && res.toSwitch <= 3) res.state = 'soon';
        if (monthly > 0 && last.d * daily > monthly) {
          res.tip = `今回の締め（${last.label}分）までの日割り（¥${yen(last.d * daily)}）は月極（¥${yen(monthly)}）より高くなっています。あと${res.toSwitch}日借りると月極に切り替わり、¥${yen(last.d * daily - monthly)}安くなります。`;
        }
      } else {
        res.shortSeg = last; // 締め日までの日数が足りず、この請求は月極にならない
      }
    } else {
      res.paidUntil = last.natEnd; // 月極で追加料金なしの最終日
      if (res.ongoing) res.state = 'monthly';
    }
    if (res.ongoing && segs.length > 1 && last.d <= 3) res.newMonth = { prev: segs[segs.length - 2], cur: last };
    return res;
  }
  const caseName = (c) => `${c.clientName || '（施主未入力）'}様邸`;

  // ---------- LINE で送られた「捨てた記録」を読み取る ----------
  // 例：「ヒラヤマ 住吉区 シバ 3t」「住吉 ミンチ 2.4トン 平山」「11/8 山田邸 有筋 4t」
  // ひらがな→カタカナ、全角→半角にそろえてから照合する
  const kana = (str) => String(str || '').normalize('NFKC').replace(/[ぁ-ゖ]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) + 0x60)).toLowerCase();
  // 住所などの照合用：空白・記号と「都道府県市区町村」を除く
  const squash = (str) => kana(str).replace(/[\s、,，・\-ー－−()（）「」『』様邸]/g, '').replace(/[都道府県市区町村]/g, '');

  // ゴミの種類の言い方（長いものから照合する）
  const WASTE_WORDS = [
    ['有筋ガラ', 'concreteR'], ['鉄筋ガラ', 'concreteR'], ['有筋', 'concreteR'],
    ['無筋ガラ', 'concrete'], ['コンクリートガラ', 'concrete'], ['コンクリガラ', 'concrete'], ['コンガラ', 'concrete'], ['無筋', 'concrete'], ['コンクリ', 'concrete'],
    ['アスファルト', 'asphalt'], ['アスガラ', 'asphalt'], ['アスコン', 'asphalt'],
    ['ガラス', 'glass'], ['ガラ', 'concrete'],
    ['木クズ', 'wood'], ['木屑', 'wood'], ['廃木材', 'wood'], ['木材', 'wood'], ['シバ', 'wood'], ['柴', 'wood'], ['木', 'wood'],
    ['混合廃棄物', 'mixed'], ['ミンチ', 'mixed'], ['混廃', 'mixed'], ['混合', 'mixed'],
    ['廃プラ', 'plastic'], ['プラ', 'plastic'],
    ['カワラ', 'glass'], ['瓦', 'glass'], ['陶器', 'glass'],
    ['石膏ボード', 'gypsum'], ['セッコウ', 'gypsum'], ['石膏', 'gypsum'], ['ボード', 'gypsum'],
    ['鉄クズ', 'metal'], ['金属', 'metal'], ['鉄', 'metal'],
    ['アスベスト', 'asb'], ['石綿', 'asb'],
  ].map(([w, t]) => [kana(w), t]).sort((a, b) => b[0].length - a[0].length);

  // いちばん長く一致する部分の長さ（照合の点数）
  function overlap(a, b) {
    if (!a || !b) return 0;
    if (b.includes(a)) return a.length + 2; // 送った言葉がまるごと含まれていれば高得点
    let best = 0;
    for (let i = 0; i < a.length; i++) for (let j = i + best + 1; j <= a.length; j++) { if (b.includes(a.slice(i, j))) best = j - i; else break; }
    return best >= 2 ? best : 0;
  }

  // 処分場の候補：登録した処分場（名前と呼び方）、これまでのマニフェストの処分業者、いつもの処分業者
  function siteCandidates(state) {
    const s = state.settings || {}, out = [];
    (s.sites || []).forEach((st) => { if (st.name) out.push({ name: st.name, words: [st.name].concat(String(st.alias || '').split(/[,、，\s]+/)).filter(Boolean) }); });
    const seen = new Set(out.map((x) => x.name));
    const add = (n) => { if (n && !seen.has(n)) { seen.add(n); out.push({ name: n, words: [n] }); } };
    add(s.defDisposer);
    (state.cases || []).forEach((c) => (c.manifests || []).forEach((m) => add(m.disposer)));
    return out;
  }

  const activeCase = (c, now) => {
    const end = c.endDate ? new Date(c.endDate + 'T00:00:00') : null;
    const start = c.startDate ? new Date(c.startDate + 'T00:00:00') : null;
    return (!end || end >= addDays(isoOf(now), -21)) && (!start || start <= addDays(isoOf(now), 14));
  };
  const caseLabel = (c) => `${caseName(c)}${c.siteAddress ? '（' + c.siteAddress + '）' : ''}`;

  // 単価：処分場ごとの単価 → 標準の単価。単位（円/t・円/kg・円/㎥）も種類・処分場ごとに決められる
  const stdUnit = (s, type) => ((s.priceUnits || {})[type]) || ((WT[type] || {}).unit === '㎥' ? '㎥' : 't');
  function priceInfo(state, disposer, type) {
    const s = state.settings || {};
    const st = (s.sites || []).find((x) => x.name && x.name.trim() === String(disposer || '').trim());
    const v = st && st.prices ? st.prices[type] : '';
    if (v !== '' && v != null) return { price: num(v), unit: ((st.units || {})[type]) || stdUnit(s, type), site: true };
    return { price: num((s.dispPrices || {})[type]), unit: stdUnit(s, type), site: false };
  }
  function priceFor(state, disposer, type) { return priceInfo(state, disposer, type).price; }
  // 処分代：数量（t か ㎥）× 単価（円/t・円/kg・円/㎥）。単位が合わないときは null
  function costOf(qty, qtyUnit, price, priceUnit) {
    if (qtyUnit === '㎥') return priceUnit === '㎥' ? qty * price : null;
    if (priceUnit === 'kg') return qty * 1000 * price;
    if (priceUnit === 't') return qty * price;
    return null;
  }

  function parseRecord(text, state, date) {
    const now = todayOf(date);
    let t = kana(text).replace(/[、,，・\/]+/g, ' ').replace(/\s+/g, ' ').trim();
    const raw = String(text || '').normalize('NFKC');
    // 日付（なければ今日）：「11/8」「11月8日」「昨日」
    let day = new Date(now);
    const md = raw.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})\s*日?/);
    if (md) {
      day = new Date(now.getFullYear(), num(md[1]) - 1, num(md[2]));
      if (day > addDays(isoOf(now), 7)) day.setFullYear(day.getFullYear() - 1);
      t = t.replace(kana(md[0]).replace(/\//g, ' '), ' ');
    } else if (/昨日|きのう/.test(raw)) { day = addDays(isoOf(now), -1); t = t.replace(/昨日|キノウ/g, ' '); }
    else if (/一昨日|おととい/.test(raw)) { day = addDays(isoOf(now), -2); t = t.replace(/一昨日|オトトイ/g, ' '); }
    // 重さ・量：「3t」「3トン」「2.4ton」「3000kg」「3000キロ」「2m3」「2立米」
    let qty = null, unit = 't', explicit = false;
    const w = t.match(/(\d+(?:\.\d+)?)\s*(トン|ton|t|kg|キロ|m3|立米|リューベ)(?![a-z])/i);
    if (w) {
      qty = num(w[1]); explicit = true;
      if (/kg|キロ/i.test(w[2])) qty = qty / 1000;
      if (/m3|立米|リューベ/i.test(w[2])) unit = 'm3';
      t = t.replace(w[0], ' ');
    }
    // ゴミの種類（自分で足した種類の名前・呼び方も見る）
    setCustomTypes((state.settings || {}).customTypes);
    const custom = WASTE_TYPES.filter((w) => w.custom).flatMap((w) => [w.name].concat(String(w.alias || '').split(/[,、，\s]+/)).filter(Boolean).map((x) => [kana(x), w.id]));
    const words = custom.concat(WASTE_WORDS).sort((a, b) => b[0].length - a[0].length);
    let type = null;
    for (const [word, id] of words) { const i = t.indexOf(word); if (i >= 0) { type = id; t = t.slice(0, i) + ' ' + t.slice(i + word.length); break; } }
    if (qty == null) { const bare = t.match(/(?:^|\s)(\d+(?:\.\d+)?)(?=\s|$)/); if (bare) { qty = num(bare[1]); t = t.replace(bare[0], ' '); } } // 単位なしの数字はトンとみなす
    // 空白なしで続けて書かれても分けられるよう、カタカナ・英字と漢字・ひらがなの境目でも区切る（「ヒラヤマ住吉区」→「ヒラヤマ」「住吉区」）
    const split = (x) => x.match(/[\u30a0-\u30ffa-z0-9ー]+|[^\u30a0-\u30ffa-z0-9ー]+/g) || [];
    const tokens = t.split(' ').flatMap((x) => { const parts = split(x.trim()); return parts.length > 1 ? [x.trim()].concat(parts) : parts; })
      .filter((x) => x.length >= 2 || /[\u4e00-\u9fff]/.test(x)); // 「堺」など漢字1文字の地名も使う

    // 処分場
    const sites = siteCandidates(state);
    let disposer = null; const used = new Set();
    let best = { score: 0 };
    tokens.forEach((tok) => sites.forEach((st) => st.words.forEach((wd) => {
      const sc = overlap(squash(tok), squash(wd));
      if (sc > best.score) best = { score: sc, name: st.name, tok };
    })));
    if (best.score >= 3 || (best.score >= 2 && best.tok && squash(best.tok).length <= 3)) { disposer = best.name; used.add(best.tok); }

    // 現場
    const cases = (state.cases || []);
    const scored = cases.map((c) => {
      let sc = 0;
      tokens.filter((tok) => !used.has(tok)).forEach((tok) => {
        const k = squash(tok);
        sc = Math.max(sc, overlap(k, squash(c.siteAddress)), overlap(k, squash(c.clientName)), overlap(k, squash(c.estimateNo)));
      });
      return { c, sc };
    }).filter((x) => x.sc > 0).sort((a, b) => b.sc - a.sc);
    let target = null, candidates = [];
    if (scored.length && (scored.length === 1 || scored[0].sc > scored[1].sc)) target = scored[0].c;
    else if (scored.length) candidates = scored.filter((x) => x.sc === scored[0].sc).map((x) => x.c);
    else {
      const act = cases.filter((c) => activeCase(c, now));
      if (act.length === 1) target = act[0]; else candidates = act.length ? act : cases;
    }
    // 現場の照合に使わなかった言葉は、未登録の処分場の名前として使う
    if (!disposer) {
      // 空白で区切られた言葉のうち、現場の地名・施主名と重なる部分を取り除いた残りを処分場名にする（「タナカ産業伏見」→「タナカ産業」）
      const strip = (tok) => {
        if (!target) return tok;
        let out = tok;
        [target.siteAddress, target.clientName].forEach((f) => {
          const k = kana(f || '').replace(/\s/g, '');
          for (let len = Math.min(out.length, k.length); len >= 2; len--) {
            let hit = '';
            for (let i = 0; i + len <= out.length; i++) { const sub = out.slice(i, i + len); if (k.includes(sub)) { hit = sub; break; } }
            if (hit) { out = out.replace(hit, ''); break; }
          }
        });
        return out.trim();
      };
      const rest = t.split(' ').map((x) => x.trim()).filter(Boolean).map(strip).filter((x) => x.length >= 2);
      disposer = rest.length ? rest[0] : ((state.settings || {}).defDisposer || '');
    }

    // 単位を書かずに数字だけのとき：単価が㎥の種類なら㎥、100以上ならkgとみなす
    if (!explicit && qty != null && type) {
      if (priceInfo(state, disposer, type).unit === '㎥') unit = 'm3';
      else if (qty >= 100) qty = qty / 1000;
    }
    const res = { type, qty, unit, date: isoOf(day), disposer, target, candidates };
    res.missing = [!type && 'type', qty == null && 'qty', !target && 'case'].filter(Boolean);
    return res;
  }

  // 伝票の写真から AI が読み取った項目を、文章の記録（parseRecord に渡せる1行）に変える
  // t = { date: 'YYYY-MM-DD', disposer: '処分場', site: '現場・排出場所', waste: '品名', net_kg: 数字, net_t: 数字 }
  function ticketToText(t) {
    if (!t) return '';
    const parts = [];
    if (t.date && /^\d{4}-\d{1,2}-\d{1,2}$/.test(t.date)) { const [, m, d] = t.date.split('-'); parts.push(`${num(m)}/${num(d)}`); }
    if (t.disposer) parts.push(String(t.disposer).replace(/\s+/g, ''));
    if (t.site) parts.push(String(t.site).replace(/\s+/g, ''));
    if (t.waste) parts.push(String(t.waste).replace(/\s+/g, ''));
    const tons = num(t.net_t) > 0 ? num(t.net_t) : (num(t.net_kg) > 0 ? num(t.net_kg) / 1000 : 0);
    if (tons > 0) parts.push(`${Math.round(tons * 1000) / 1000}t`);
    return parts.join(' ');
  }
  // 伝票を読み取る AI への指示（返事は JSON だけ）
  const TICKET_PROMPT = 'これは産業廃棄物を処分場に持ち込んだときの計量伝票（計量票・受入伝票）の写真です。次の項目を読み取り、JSONだけを返してください。読めない項目は null にしてください。\n' +
    '{"date":"計量日（YYYY-MM-DD）","disposer":"処分場・受入先の会社名","site":"排出場所・現場名・現場住所（なければ null）","waste":"品名・廃棄物の種類（例：木くず、コンクリートがら、混合廃棄物、廃プラ、瓦、石膏ボード）","net_kg":"正味重量（kg、数字だけ）","net_t":"正味重量がトンで書かれていればその数字"}\n' +
    '注意：総重量・空車重量ではなく、正味（NET・差引）重量を使ってください。伝票でない写真なら {"not_ticket":true} を返してください。';

  // マニフェスト1枚分（画面と同じ形）
  function manifestFromRecord(r, state, by) {
    return {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), kind: 'paper', no: '', date: r.date, type: r.type,
      qty: String(Math.round(r.qty * 1000) / 1000), unit: r.unit === 'm3' ? '㎥' : 't', carrier: (state.settings || {}).defCarrier || '', disposer: r.disposer || '',
      reg: '', b2: '', d: '', e: '', via: 'line', lineBy: by || '', lineAt: new Date().toISOString(),
    };
  }

  const LINE_HELP = '【カイタイ事務】捨てた記録の送り方\n処分場・現場・ゴミの種類・重さを、空白で区切って送ってください。順番は自由です。\n\n例）ヒラヤマ 住吉区 シバ 3t\n例）住吉 ミンチ 2.4トン 平山\n例）11/8 山田 有筋 4t（日付を付けると、その日の記録になります）\n\n間違えたときは「取消」と送ると、直前の記録を消します。';

  function recordReply(r, state) {
    const w = WT[r.type] || { name: r.type, unit: 't' };
    const pi = priceInfo(state, r.disposer, r.type), qu = r.unit === 'm3' ? '㎥' : 't', cost = costOf(r.qty, qu, pi.price, pi.unit);
    const qtyTxt = qu === '㎥' ? `${r.qty}㎥` : pi.unit === 'kg' ? `${Math.round(r.qty * 1000)}kg` : `${r.qty}t`;
    const costTxt = !pi.price ? '単価未登録' : cost == null ? `単価が「円/${pi.unit}」なので計算できません（${pi.unit === '㎥' ? '㎥（立米）' : '重さ'}で送ってください）` : `¥${yen(cost)}（単価 ¥${yen(pi.price)}/${pi.unit}）`;
    const site = (state.settings && (state.settings.sites || []).find((x) => x.name === r.disposer)) ? '' : '（単価が未登録の処分場です）';
    return `✅ 登録しました\n現場：${caseLabel(r.target)}\n日付：${r.date.replace(/^\d+-0?(\d+)-0?(\d+)$/, '$1/$2')}\nゴミ：${w.name} ${qtyTxt}\n処分場：${r.disposer || '（未入力）'}${site}\n処分代：${costTxt}\n\n間違えたら「取消」と送ってください。`;
  }
  function askReply(r) {
    const parts = [];
    if (r.missing.includes('type')) parts.push('ゴミの種類（シバ・ガラ・有筋・ミンチ・廃プラ・瓦・石膏 など）');
    if (r.missing.includes('qty')) parts.push('重さ（例：3t、2.5トン、3000kg）');
    if (parts.length) return `読み取れなかったものがあります：\n・${parts.join('\n・')}\n\nもう一度、全部まとめて送ってください。\n例）ヒラヤマ 住吉区 シバ 3t`;
    if (r.missing.includes('case')) {
      const list = (r.candidates || []).slice(0, 9);
      if (!list.length) return '現場が見つかりませんでした。カイタイ事務に現場（案件）を登録してから送ってください。';
      return 'どの現場ですか？ 番号だけ送ってください。\n' + list.map((c, i) => `${i + 1}. ${caseLabel(c)}`).join('\n');
    }
    return '';
  }

  // 毎朝の通知に載せる注意をまとめる（画面の「全案件の注意」と同じ基準）
  function collectAlerts(state, date) {
    setCustomTypes((state.settings || {}).customTypes);
    const now = todayOf(date);
    const settings = state.settings || {};
    const out = { lease: [], manifest: [], schedule: [] };
    (state.cases || []).forEach((c) => {
      const name = caseName(c);
      // リース
      (c.leases || []).forEach((l) => {
        const r = leaseCalc(l, settings, null, now);
        if (!r.ongoing || r.state === 'bad' || r.state === 'none') return;
        const who = `${name} ${l.name || 'リース'}`;
        if (r.state === 'soon' && r.tip) out.lease.push(`${who}：あと${r.toSwitch}日で月極。${r.tip}`);

    const pick = (id) => {

      else if (inR) { if (!inB || !same(R.get(id), B.get(id))) out.push(R.get(id)); } // 自分が消した：相手が直していなければ消す
